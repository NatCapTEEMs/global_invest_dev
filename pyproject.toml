[project]
name = "global_invest"
description = "Global ecosystem service models for the Gross Ecosystem Product account"
readme = "README.md"
requires-python = ">=3.6"
license = { file = "LICENSE" }
maintainers = [
        {name = "Justin Andrew Johnson"}
]
keywords = ["geospatial", "raster", "shapefile"]
classifiers = [
        "Development Status :: 5 - Production/Stable",
        "Intended Audience :: Science/Research",
        "Programming Language :: Cython",
        "Programming Language :: Python :: 3",
]
dynamic = ["version"]

# Every package a service imports at module level, so a fresh environment built from this file
# can import the library. Taken from the imports themselves rather than typed from memory: an
# AST sweep over global_invest/ splits module-level imports, which fail at import time when
# absent, from imports inside functions, which are optional and live under [optional-dependencies].
dependencies = [
        "geopandas",
        "hazelbean",
        "joblib",
        "matplotlib",
        "numpy",
        "pandas",
        "pygeoprocessing",
        "rasterio",
        "requests",
        "rioxarray",
        "scipy",
        "shapely",
        "statsmodels",
        "tqdm",
        "xarray",
]

[project.optional-dependencies]
# Imported inside the functions that need them, so the library imports without these and only the
# step that uses one fails. GDAL is here because it is installed through conda in this stack
# rather than resolved by pip, and pinning it as a hard requirement breaks that install.
gdal = ["GDAL"]
# natcap.invest runs erosion's SDR model; mapclassify classifies erosion's map breaks and has a
# quantile fallback; contextily draws landslide basemaps and fetches its tiles over the network.
models = ["natcap.invest", "mapclassify", "contextily"]
# fisheries reads a HAR file through gtappy, a sibling repo in this stack rather than a PyPI
# package, so it is installed from source alongside this one.
gtap = ["gtappy"]
test = ["pytest"]

[project.urls]
repository = "https://github.com/NatCapTEEMs/global_invest_dev"

[build-system]
requires = [
        "setuptools>=74.1",  # Ensure your setuptools version supports this TOML config
        "wheel",
        "cython>3.0.0",
        "setuptools_scm", # Added setuptools_scm here as it's used below
        'oldest-supported-numpy; python_version<"3.8"',
        'numpy>2; python_version>="3.8"',
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"

# Added section to control package discovery for flat layout
[tool.setuptools.packages.find]
where = ["."]
exclude = ["docs*"]